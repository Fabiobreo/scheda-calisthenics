<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="color-scheme" content="dark" />
    <!-- aspetto scelto in Account (ticket 43): fondo e metallo su <html> prima del primo disegno, così l'app non parte
         in Notte per poi cambiare. Chiave e nomi sono quelli di src/app/look.ts; un valore sconosciuto non fa nulla. -->
    <script>
      try {
        var look = JSON.parse(localStorage.getItem('scheda:look') || 'null');
        if (look) {
          if (look.ground) document.documentElement.dataset.ground = look.ground;
          if (look.metal) document.documentElement.dataset.metal = look.metal;
          if (look.ground === 'marmo') {
            document.querySelector('meta[name="theme-color"]').content = '#ebe6dc';
            document.querySelector('meta[name="color-scheme"]').content = 'light';
          }
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Registro allenamenti: programma, serie, record e grafici." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- foto di sfondo (ticket 33): precaricata, è il primo disegno insieme alla testata -->
    <link rel="preload" as="image" type="image/webp" href="/bg/palestra-688.webp" imagesrcset="/bg/palestra-480.webp 480w, /bg/palestra-688.webp 688w" imagesizes="100vw" fetchpriority="high" />
    <title>Kalos</title>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <img src="/bg/palestra-688.webp" srcset="/bg/palestra-480.webp 480w, /bg/palestra-688.webp 688w" sizes="100vw" width="688" height="1536" alt="" fetchpriority="high" decoding="async" />
      <!-- foto del fondo Marmo (ticket 43): nascosta finché il fondo è Notte, e con loading="lazy" finché è nascosta non si scarica -->
      <img class="marmo" src="/bg/marmo-960.webp" srcset="/bg/marmo-640.webp 640w, /bg/marmo-960.webp 960w" sizes="100vw" width="960" height="720" alt="" loading="lazy" decoding="async" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
